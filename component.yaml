apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/audit
  name: Audit
  version: 3.0.0
  description: "The audit component: every component's audit records taken over the system surface, idempotently by source and ID, with receipts, the backed-up watermark and the query; the evidence store comes with protocol 15"
  repository: https://github.com/brickKit/infra-audit

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8206
  extraPorts:
    - name: grpc
      port: 9206
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/infra-audit", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

configSchema:
  type: object
  required:
  - DEPLOYMENT_ID
  - IAM_ISSUER
  - IAM_JWKS_URL
  - AUTHZ_GRPC_URL
  - SERVICE_TLS_CERT_FILE
  - SERVICE_TLS_KEY_FILE
  - SERVICE_TLS_CA_FILE
  - PG_HOST
  - PG_DATABASE
  - PG_USER
  - PG_PASSWORD
  - PG_SCHEMA
  properties:
    LOG_LEVEL:
      type: string
      enum:
      - debug
      - info
      - warn
      - error
      description: SDK default info
    OTEL_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    STOP_DRAIN_DELAY:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 2s
    STOP_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 30s
    DEPLOYMENT_ID:
      type: string
      description: 'process-level: the same for every member of a shell'
    IAM_ISSUER:
      type: string
      description: 'process-level: the same for every member of a shell'
    IAM_JWKS_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    AUTHZ_GRPC_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    AUDIT_GRPC_URL:
      type: string
      description: 'process-level; for this component its own system surface ($endpoint:infra/audit:grpc): its own audit records go through the same intake'
    SERVICE_TLS_CERT_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    SERVICE_TLS_KEY_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    SERVICE_TLS_CA_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    PG_HOST:
      type: string
    PG_PORT:
      type: integer
      description: SDK default 5432
    PG_DATABASE:
      type: string
    PG_USER:
      type: string
    PG_PASSWORD:
      type: string
      secret: true
    PG_SCHEMA:
      type: string
    PG_POOLER_PREPARED:
      type: boolean
      description: SDK default true
    PG_STATEMENT_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 5s
    PG_LOCK_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 2s
    PG_IDLE_IN_TX_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 10s
    PG_POOL_FOREGROUND:
      type: integer
      description: SDK default 8
    PG_POOL_BACKGROUND:
      type: integer
      description: SDK default 4
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_USER:
      type: string
    PG_OWNER_PASSWORD:
      type: string
      secret: true
