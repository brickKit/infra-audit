apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/audit
  name: Audit
  version: 3.0.43
  description: "The audit component: every component's audit records taken over the system surface, idempotently by source and ID, with receipts, the backed-up watermark and the query; the evidence store comes with protocol 15"
  repository: https://github.com/brickKit/infra-audit

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8206
  extraPorts:
    - name: grpc
      port: 9206
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/infra-audit", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

configSchema:
  properties:
    ALERT_WEBHOOK_URL:
      type: string
    AUDIT_CHAIN_CHECK_INTERVAL:
      description: a duration (e.g. 2s, 500ms); SDK default 86400s
      type: string
    AUDIT_EVIDENCE_READERS:
      description: the components that may list the evidence and the audit records (comma-separated component IDs); default ops/recover, the recovery tool; SDK default ops/recover
      type: string
    AUDIT_GRPC_URL:
      description: 'process-level; for this component its own system surface ($endpoint:infra/audit:grpc): its own audit records go through the same intake; process-level: the same for every member of a shell'
      type: string
    AUTHZ_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    DEPLOYMENT_ID:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_ISSUER:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_JWKS_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    LOG_LEVEL:
      description: SDK default info
      enum:
        - debug
        - info
        - warn
        - error
      type: string
    OTEL_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    PG_DATABASE:
      type: string
    PG_HOST:
      type: string
    PG_IDLE_IN_TX_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 10s
      type: string
    PG_LOCK_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_PASSWORD:
      secret: true
      type: string
    PG_OWNER_USER:
      type: string
    PG_PASSWORD:
      secret: true
      type: string
    PG_POOL_BACKGROUND:
      description: SDK default 4
      type: integer
    PG_POOL_FOREGROUND:
      description: SDK default 8
      type: integer
    PG_POOLER_PREPARED:
      description: SDK default true
      type: boolean
    PG_PORT:
      description: SDK default 5432
      type: integer
    PG_SCHEMA:
      type: string
    PG_STATEMENT_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 5s
      type: string
    PG_USER:
      type: string
    RECOVERY_PHASE:
      description: 'process-level: the same for every member of a shell'
      enum:
        - frozen
        - redelivering
        - replaying
        - verifying
        - read_only
      type: string
    RUN_PROFILE_ACCESS_KEY:
      type: string
    RUN_PROFILE_BUCKET:
      type: string
    RUN_PROFILE_REGION:
      description: SDK default us-east-1
      type: string
    RUN_PROFILE_SECRET_KEY:
      secret: true
      type: string
    RUN_PROFILE_URL:
      type: string
    SERVICE_TLS_CA_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_CERT_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_KEY_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    STOP_DRAIN_DELAY:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    STOP_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 30s
      type: string
    TIERING_BUCKET:
      description: SDK default be-tiering
      type: string
    TIERING_COLD_CONCURRENCY:
      description: SDK default 4
      type: integer
    TIERING_COLD_SYNC_LIMIT:
      description: a duration (e.g. 2s, 500ms); SDK default 10s
      type: string
    TIERING_DELETE_ACCESS_KEY:
      type: string
    TIERING_DELETE_SECRET_KEY:
      secret: true
      type: string
    TIERING_GRACE:
      description: a duration (e.g. 2s, 500ms); SDK default 604800s
      type: string
    TIERING_LIST_DAYS:
      description: SDK default 90
      type: integer
    TIERING_READ_ACCESS_KEY:
      type: string
    TIERING_READ_SECRET_KEY:
      secret: true
      type: string
    TIERING_RESIDENCE_INFRA_AUDIT_RECORDS:
      type: string
    TIERING_RETENTION_INFRA_AUDIT_RECORDS:
      type: string
    TIERING_ROUTE_INFRA_AUDIT_RECORDS:
      type: string
    TIERING_STORE_URL:
      type: string
    TIERING_WINDOW:
      description: SDK default 0 2 * * *
      type: string
    TIERING_WRITE_ACCESS_KEY:
      type: string
    TIERING_WRITE_SECRET_KEY:
      secret: true
      type: string
  required:
    - PG_DATABASE
    - PG_HOST
    - PG_PASSWORD
    - PG_SCHEMA
    - PG_USER
  type: object

release:
  goModule: true
