// The audit component's system surface: every component's SDK hands over its local audit records and reads the
// backed-up watermark before deleting them. Only the envelope is protobuf; a record travels as its canonical JSON
// bytes (be.audit.record, D76) with its digest beside it. Rules: the assembly project's protocol 03 and protocol 14
// (epochs and fork points), the component protocol's chapter 08 (P8.19-P8.23); the audit component's obligations are
// in contract/README.md.
syntax = "proto3";

package be.audit.v3;

option go_package = "github.com/brickKit/infra-audit/contract/v3/gen/go/be/audit/v3;auditv3";

// IntakeService takes audit records and tells how far they are backed up.
service IntakeService {
  // Submit stores records idempotently by ID and returns a receipt for each. Callers: every component, through
  // its SDK's transfer work item, with its service identity.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  // Watermark returns the backed-up watermark; a component deletes a local row only once its receipt is covered.
  rpc Watermark(WatermarkRequest) returns (WatermarkResponse);
}

// Item is one local audit row as it is sent.
message Item {
  // The record's ID (be.audit.record's id).
  string id = 1;
  // The production sequence in the source component, within epoch (P8.20).
  int64 seq = 2;
  // The source database's epoch, "<deployment recovery generation>.<timeline>".
  string epoch = 3;
  // P8.8 over record, record type be.audit.record, major 1.
  string digest = 4;
  // The canonical bytes of the be.audit.record, exactly as stored with the row.
  bytes record = 5;
}

message SubmitRequest {
  // In ID order, at most 500.
  repeated Item items = 1;
}

// ReceiptStatus is what happened to one item.
enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  // Stored now, or stored before with the same digest (the original receipt is returned).
  RECEIPT_STATUS_RECEIVED = 1;
  // Stored before with another digest: refused and reported as an integrity event; the source stops sending it.
  RECEIPT_STATUS_CONFLICT = 2;
  // The bytes are not a valid be.audit.record (schema, canonical form, digest, or an id other than the item's):
  // refused and reported; the source stops sending it, as for a conflict.
  RECEIPT_STATUS_INVALID = 3;
}

message Receipt {
  string id = 1;
  ReceiptStatus status = 2;
  // RECEIPT_STATUS_RECEIVED: the audit database's epoch and the storage sequence the record got in it.
  string epoch = 3;
  int64 seq = 4;
  // RECEIPT_STATUS_RECEIVED: the digest of the source's chain up to this record.
  string chain = 5;
}

message SubmitResponse {
  // One receipt for every item, in the order of the items.
  repeated Receipt receipts = 1;
}

message WatermarkRequest {}

// Ancestor is an older epoch on the audit database's current history and its fork point.
message Ancestor {
  string epoch = 1;
  // The last storage sequence of that epoch kept in the current history.
  int64 fork = 2;
}

message WatermarkResponse {
  // The audit database's current epoch.
  string epoch = 1;
  // The highest storage sequence of epoch contained in a completed backup.
  int64 seq = 2;
  repeated Ancestor ancestors = 3;
  // Whether a backup has completed in epoch (receipts of ancestors are covered only after one).
  bool backed_up_in_epoch = 4;
}

// EvidenceService is the evidence store the audit component also serves (assembly protocol 15, component protocol
// P12.9-P12.14): the records a full restore must not lose, kept apart from the audit records, never rolled back.
service EvidenceService {
  // Append keeps each record once by (id, phase) and answers each in order. Callers: every component, with its
  // service identity, for its own records only (the recorder is the caller, P12.11).
  rpc Append(AppendRequest) returns (AppendResponse);
  // List returns records in the store's order after a position. Callers: the configured readers (the recovery tool).
  rpc List(ListRequest) returns (ListResponse);
}

// Evidence is one evidence record as it travels: its canonical JSON (be.evidence.record) with its digest.
message Evidence {
  // The record's canonical JSON bytes.
  bytes record = 1;
  // sha256:<hex> over "be.evidence.record.v1\n" and the bytes.
  string digest = 2;
}

message AppendRequest {
  // At most 500 records.
  repeated Evidence records = 1;
}

// EvidenceStatus is what happened to one record (P12.10).
enum EvidenceStatus {
  EVIDENCE_STATUS_UNSPECIFIED = 0;
  // Kept now.
  EVIDENCE_STATUS_ACCEPTED = 1;
  // Kept before with the same digest: the receipt is the original one.
  EVIDENCE_STATUS_DUPLICATE = 2;
  // Another digest under the same (id, phase), or a conclusion that does not match its intent: not kept.
  EVIDENCE_STATUS_CONFLICT = 3;
  // Not a valid record (schema, canonical form, digest): not kept.
  EVIDENCE_STATUS_INVALID = 4;
}

message EvidenceReceipt {
  string id = 1;
  string phase = 2;
  EvidenceStatus status = 3;
  // ACCEPTED or DUPLICATE: the store's own epoch and sequence the record got (P12.12).
  string epoch = 4;
  int64 seq = 5;
}

message AppendResponse {
  // One receipt for every record, in the order of the records.
  repeated EvidenceReceipt receipts = 1;
}

message ListRequest {
  // The position to start after: the store's sequence (0 for the beginning).
  int64 after_seq = 1;
  // Optional filters.
  string recorder = 2;
  string category = 3;
  // At most 500; 0 for 500.
  int32 limit = 4;
}

// StoredEvidence is a kept record with its position in the store.
message StoredEvidence {
  Evidence evidence = 1;
  string epoch = 2;
  int64 seq = 3;
  // When the store received it (its own clock).
  string received_at = 4;
}

message ListResponse {
  repeated StoredEvidence records = 1;
  // Set when more may follow: list again after the last record's seq.
  bool more = 2;
}

// RecordService lets the configured readers (the recovery tool, AUDIT_EVIDENCE_READERS) read the audit records: a
// full recovery's loss range and audit loss (assembly protocol 15, step 9; component protocol P14.3-P14.5).
service RecordService {
  // List returns the records that occurred at or after a moment, in the store's order after a position.
  rpc List(RecordServiceListRequest) returns (RecordServiceListResponse);
}

message RecordServiceListRequest {
  // RFC 3339: only the records that occurred at or after it.
  string since = 1;
  // Only these categories (business_change, security_change, sensitive_read, ...); empty: all.
  repeated string categories = 2;
  // The position to start after: the last answer's last position; empty for the beginning.
  string after = 3;
  // At most 500, and the default.
  int32 limit = 4;
}

// StoredRecord is one audit record as the store keeps it.
message StoredRecord {
  // The source component (its certificate).
  string source = 1;
  // The record's canonical JSON bytes (be.audit.record), as received.
  bytes record = 2;
  // The source's epoch and production sequence (the audit loss is the gaps in them, protocol 03).
  string source_epoch = 3;
  int64 source_seq = 4;
  // The record's position in the store: pass the last one as after for the next page.
  string position = 5;
}

message RecordServiceListResponse {
  repeated StoredRecord records = 1;
  bool more = 2;
}
